<h2>Persistence</h2><p>localStorage. The brief leaves this open; the evaluation weights UX first, so I kept the data layer in the browser and spent time on interaction. For production I would use a backend with server-side auth and permission checks. Use “Reset demo data” to start over.</p>
<h2>Key UX decisions</h2><ul><li>Grouped list over a board: it reflows cleanly to mobile and shows every field at once.</li><li>Restricted actions are hidden or explained in context, not shown as rows of disabled buttons.</li><li>Delete is immediate with Undo, not a confirm dialog.</li><li>Overdue is shown as text, and priority and status always carry a label, never colour alone.</li><li>Keyboard: C to create, Esc to close, arrow keys in the list.</li></ul>

<h2>Where I overrode AI</h2><div class="ph2">Edit this: write one real decision you changed. Example: the first plan treated My tasks and All tasks as two separate views; I merged them into one filter.</div>
<h2>With more time</h2><p>Real auth and backend, usability testing, a fuller accessibility pass.</p></div>`}
